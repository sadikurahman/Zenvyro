<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07031a">
<meta name="robots" content="noindex,nofollow">
<title>Zenvyro Admin Panel</title>
<style>
/* 1rem = 10 px of the reference design, so every box keeps the exact proportions of the design on any phone width */
html{font-size:calc(min(100vw,460px)/85.2);-webkit-text-size-adjust:100%}
:root{--gr:#2ee59d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:#07031a;min-height:100vh}
body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(120% 45% at 85% -8%,#5a1fd8 0,#2a0f80 35%,transparent 70%),radial-gradient(80% 40% at 0 35%,#3a14a455,transparent 70%),radial-gradient(70% 35% at 100% 70%,#4a14b044,transparent 70%),#07031a}
button,input,textarea{font:inherit;color:inherit}
button{border:0;background:none;cursor:pointer;padding:0}
svg{display:block}
.app{width:min(100vw,460px);margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + .6rem) 2.8rem calc(env(safe-area-inset-bottom,0px) + 17rem)}
/* cards: vivid gradient border + tinted interior + glow */
.card{--b1:#a066ff;--b2:#3d1c9c;--b3:#c29cff;--gl:rgba(125,60,255,.42);--gi:rgba(125,60,255,.22);--i1:#2d1376;--i2:#12063f;--i3:#1f0b5a;position:relative;overflow:hidden;border:.3rem solid transparent;border-radius:2.2rem;
  background:linear-gradient(135deg,var(--i1) 0,var(--i2) 55%,var(--i3) 100%) padding-box,linear-gradient(135deg,var(--b1) 0,var(--b2) 42%,var(--b3) 100%) border-box;
  box-shadow:0 0 2.2rem var(--gl),inset 0 0 3.4rem var(--gi)}
.card:after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(70% 90% at 0 0,rgba(255,255,255,.07),transparent 60%)}
.gold{--b1:#ffb340;--b2:#6a3a30;--b3:#ffc864;--gl:rgba(255,160,40,.42);--gi:rgba(255,150,30,.2);--i1:#2f1668;--i2:#150642;--i3:#44250a}
.green{--b1:#3dffb0;--b2:#12605a;--b3:#8affd0;--gl:rgba(40,230,160,.42);--gi:rgba(40,230,160,.22);--i1:#0b4d52;--i2:#0a1b3c;--i3:#0a3340}
.red{--b1:#ff4d5e;--b2:#6a2040;--b3:#ff9a6a;--gl:rgba(255,77,94,.42);--gi:rgba(255,77,94,.22);--i1:#541029;--i2:#180838;--i3:#43152a}
.clk{cursor:pointer}
/* header */
.top{display:flex;align-items:center;justify-content:space-between;height:10.4rem}
.top .l{display:flex;align-items:center;gap:6.6rem}
.menu{width:5rem;height:5rem;display:grid;place-items:center;margin-left:-.2rem}
.menu svg{width:4.6rem;height:4.6rem;stroke:#fff;stroke-width:2.2;fill:none;stroke-linecap:round}
.brand{display:flex;align-items:center;gap:3.1rem}
.logo{width:8.5rem;height:6.4rem;filter:drop-shadow(0 0 .9rem #a45cff)}
.bt{text-align:center}
.bt b{display:block;font-size:3.2rem;letter-spacing:.5rem;font-weight:800;line-height:3.6rem;margin-right:-.5rem}
.bt span{display:block;font-size:2.9rem;color:#b57cff;font-weight:500;line-height:3.2rem}
.me{display:flex;align-items:center;gap:3rem}
.av{position:relative;width:8.6rem;height:8.6rem;border-radius:50%;padding:.3rem;background:linear-gradient(135deg,#c58bff,#4a1fb0);box-shadow:0 0 1.6rem #8b3dff}
.av svg{width:100%;height:100%;border-radius:50%}
.av i{position:absolute;right:.2rem;bottom:.5rem;width:1.7rem;height:1.7rem;border-radius:50%;background:#2ee59d;border:.3rem solid #0b0430}
.me .ch{width:2.6rem;height:2.6rem;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
/* welcome */
.wel{height:11.7rem;display:flex;align-items:center;gap:3.4rem;padding:0 2.6rem;margin-bottom:2.3rem;--i1:#2a1274;--i3:#240a66}
.wel .crown{width:10.6rem;height:8rem;flex:none;fill:url(#gGold);filter:drop-shadow(0 0 1rem #ffb34099)}
.wel h2{margin:0;font-size:2.9rem;font-weight:700;line-height:3.4rem;white-space:nowrap}
.wel p{margin:.5rem 0 0;font-size:2.2rem;color:#d9d3ff;line-height:2.6rem;white-space:nowrap}
.wv{position:absolute;right:0;bottom:0;width:40rem;height:100%;pointer-events:none}
.wel>div:not(.pill),.wel>svg.crown{position:relative;z-index:1}
.pill{position:absolute;right:.9rem;top:1.4rem;z-index:2;display:flex;align-items:center;gap:1.1rem;height:4.8rem;padding:0 2rem 0 1.8rem;border-radius:2.4rem;font-size:2.1rem;font-weight:600;color:#7affc0;background:linear-gradient(135deg,#0d4a4a,#0b2f3f);border:.2rem solid #2ee59d66;box-shadow:0 0 1.4rem #2ee59d33}
.pill i{width:1.9rem;height:1.9rem;border-radius:50%;background:#2ee59d;box-shadow:0 0 1rem #2ee59d;animation:pl 1.8s infinite}
.pill.off{color:#ff8a94;border-color:#ff4d5e77;background:linear-gradient(135deg,#4a0f20,#2f0b30)}.pill.off i{background:#ff4d5e;box-shadow:0 0 1rem #ff4d5e;animation:none}
@keyframes pl{50%{opacity:.45}}
/* stats */
.g2{display:grid;grid-template-columns:1fr 1fr;gap:2.3rem 2.8rem;margin-bottom:2.4rem}
.st{height:13.3rem;display:flex;align-items:center;gap:4.3rem;padding-left:4.2rem}
.st>svg{width:6.8rem;height:6.8rem;flex:none}
.st small,.pf small{display:block;font-size:2.1rem;line-height:3rem;color:#ece9ff;white-space:nowrap}
.st b,.pf b{display:block;font-size:3.8rem;line-height:4.2rem;font-weight:800;white-space:nowrap}
.d{display:inline-flex;align-items:center;gap:.5rem;font-size:2.1rem;line-height:3rem;font-weight:700;color:var(--gr)}
.d svg{width:2rem;height:2rem;stroke:var(--gr);fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.d em{font-style:normal}
.pf{height:12.4rem;display:grid;grid-template-columns:1fr 1fr;margin-bottom:2.4rem;--b2:#4a2aa8;--b3:#ffb340;--i3:#3a2410;background:linear-gradient(110deg,#2d1376 0,#12063f 50%,#2a1a38 100%) padding-box,linear-gradient(100deg,#a066ff 0,#4a2aa8 48%,#ffb340 100%) border-box;box-shadow:0 0 2.2rem rgba(125,60,255,.4),inset 0 0 3.4rem rgba(125,60,255,.2)}
.pf>div{display:flex;align-items:center;gap:4.6rem;padding-left:4.6rem}
.pf>div+div{position:relative;gap:4.2rem;padding-left:5.8rem}
.pf>div+div:before{content:"";position:absolute;left:0;top:2rem;bottom:2rem;width:.2rem;background:linear-gradient(#8b46ff00,#8b46ff,#8b46ff00)}
.pf>div>svg{width:6.2rem;height:6.2rem;flex:none}
.fp{fill:url(#gPur)}.fg{fill:url(#gGold)}.fn{fill:url(#gGrn)}.fr{fill:url(#gRed)}
.sk{fill:none;stroke-linejoin:round;stroke-linecap:round}
/* sections */
.sec{margin-bottom:2.4rem}
.sh{display:flex;align-items:center;justify-content:space-between}
.sh h3{margin:0;display:flex;align-items:center;gap:2.4rem;font-size:2.9rem;font-weight:700;white-space:nowrap}
.sh h3>svg{flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:1.2rem;height:4rem;padding:0 2rem;border-radius:2.2rem;font-size:2.1rem;font-weight:600;border:.2rem solid #8b57ff;background:linear-gradient(135deg,#3a1f9a88,#1a0c5a88);box-shadow:0 0 1rem #8b57ff44;white-space:nowrap}
.btn svg{width:2rem;height:2rem;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
.ov{height:30.3rem;padding:1.5rem 2.4rem 0}
.ov .sh{height:4.4rem}
.ov .btn{width:15.5rem;height:4.4rem}
.rng{position:relative}
.menu2{display:none;position:absolute;right:0;top:5rem;z-index:5;min-width:15rem;border-radius:1.4rem;border:.2rem solid #8b57ff;background:#170a48;padding:.5rem}
.rng.open .menu2{display:block}
.menu2 button{display:block;width:100%;text-align:left;padding:1.1rem 1.4rem;font-size:2rem;border-radius:1rem;white-space:nowrap}
.menu2 button.on{background:#3a1f9a}
.lg{display:flex;justify-content:flex-end;gap:5.2rem;height:3rem;margin:.1rem 4.6rem 0 0;font-size:2.1rem;line-height:3rem}
.lg span{display:flex;align-items:center;gap:1.1rem}.lg i{width:1.8rem;height:1.8rem;border-radius:50%}
#chart{display:block;width:100%;height:20.2rem;margin-top:.3rem;overflow:visible}
#chart text{fill:#e0dbff;font-size:19px}
.pd{padding:1.4rem 0 1rem}
.pd .sh{height:3.9rem;padding:0 2.3rem 0 2.3rem;margin-bottom:1.2rem}
.pd .btn{height:3.9rem;padding:0 1.8rem}
.rq{display:flex;align-items:center;height:5.3rem;padding:0 2.8rem 0 3rem;border-top:.1rem solid #7a4cff44}
.rq .bx{width:5.7rem;height:3.8rem;border-radius:1.1rem;display:grid;place-items:center;flex:none;margin-right:3.8rem;box-shadow:0 0 1rem #0006}
.rq .bx svg{width:2.6rem;height:2.6rem;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bx.p{background:linear-gradient(135deg,#9a4dff,#4a1fb0)}.bx.g{background:linear-gradient(135deg,#1fd98a,#0a6a5a)}.bx.b{background:linear-gradient(135deg,#3f8bff,#1a3fb0)}
.rq .n{width:26.4rem;flex:none;font-size:2.1rem;color:#efecff;white-space:nowrap}
.rq .bd{width:3.5rem;height:3.5rem;flex:none;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff5a66,#d81428);display:grid;place-items:center;font-size:1.9rem;font-weight:700;box-shadow:0 0 1.2rem #ff2a3a99;margin-right:13.2rem}
.rq .bd.z{visibility:hidden}
.rq .sm{height:3.7rem;border-radius:1.1rem;font-size:2.1rem;font-weight:600;padding:0}
.rq .sm[data-view]{width:8.6rem;margin-right:2.8rem}
.rq .ap{width:9.9rem}
.sm{font-size:13px;font-weight:600;padding:7px 14px;border-radius:10px;border:1px solid #8b57ff;background:linear-gradient(135deg,#3a1f9a,#22106a);color:#fff}
.ap{border-color:#3dff8a;background:linear-gradient(135deg,#22c04a,#0f8a2e);color:#d6ffe2;box-shadow:0 0 1rem #22c04a55}
.ap:disabled{opacity:.45}
.ms{display:flex;align-items:center;height:9.6rem;padding-left:5.4rem}
.ms .dm{width:9.5rem;height:7.7rem;flex:none;filter:drop-shadow(0 0 1.2rem #a45cff)}
.ms .col{width:20.1rem;margin-left:9.8rem}
.ms .col+.col{width:auto;margin-left:5.1rem;padding-left:5.2rem;border-left:.2rem solid #7d3cff55;height:7rem;display:flex;flex-direction:column;justify-content:center}
.ms .col:first-of-type{height:7rem;display:flex;flex-direction:column;justify-content:center}
.ms small{display:block;font-size:2.1rem;line-height:3rem;color:#ece9ff}
.ms b{display:block;font-size:3rem;line-height:3.4rem;font-weight:800;white-space:nowrap}
.ms .col .d{line-height:3rem}
.mm{padding:1.1rem 2.3rem 0 2.3rem}
.mm .sh{height:4rem}
.qa{padding:0 2rem 1.1rem}
.qa .row{display:grid;grid-template-columns:repeat(4,1fr);gap:1.8rem;margin-top:1.1rem}
.qa .row button{height:9.2rem;border-radius:1.5rem;border:.2rem solid #6a3cff88;background:linear-gradient(160deg,#2a1380aa,#12063f);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6rem;font-size:1.9rem;line-height:1.95rem;text-align:center;box-shadow:inset 0 0 1.6rem #7d3cff33}
.qa .row svg{width:3.6rem;height:3.6rem;fill:#d2b6ff}
.qa .sh{height:3.4rem;padding:.8rem 0 0 .7rem}
/* nav */
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + .6rem);width:83.6rem;height:13.2rem;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;padding:0 1rem;border-radius:3.2rem;border:.3rem solid transparent;background:linear-gradient(#0e0536f2,#0a0430f2) padding-box,linear-gradient(135deg,#9a55ff,#3a1b9a 50%,#b78cff) border-box;box-shadow:0 0 2.4rem rgba(125,60,255,.5);z-index:20}
.nav button{height:10.6rem;border-radius:2.4rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9rem;font-size:2.1rem;color:#ece9ff;border:.2rem solid transparent}
.nav svg{width:3.8rem;height:3.8rem;fill:#fff}
.nav button.on{background:linear-gradient(135deg,#8a38ff,#4a1fb0);border-color:#c9a2ff;box-shadow:0 0 1.8rem #8b3dffaa,inset 0 0 1.4rem #ffffff22;color:#fff;font-weight:600}
/* sheets (px based, easy to read) */
.sheet{position:fixed;inset:0;z-index:50;background:#02000dcc;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.box{width:min(460px,100%);max-height:86vh;overflow:auto;font-size:14px;border-radius:22px 22px 0 0;border:1.5px solid #7d3cff88;border-bottom:0;background:linear-gradient(180deg,#1b0c4d,#0a0428);padding:14px 14px calc(env(safe-area-inset-bottom,0px) + 18px)}
.box .hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.box .hd b{font-size:18px}
.x{width:32px;height:32px;display:grid;place-items:center;border-radius:50%;background:#3a1f9a}
.x svg{width:16px;height:16px;stroke:#fff;fill:none;stroke-width:2.6;stroke-linecap:round}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid #6a3cff33}
.li:first-child{border-top:0}.li small{display:block;color:#b9b2f5;font-size:12px;margin-top:2px}
.li a{color:#fff;text-decoration:none;display:block;width:100%}
.li.u{cursor:pointer}
.box .bd{min-width:24px;height:24px;border-radius:50%;background:#e8222f;display:grid;place-items:center;font-size:12px;font-weight:700}
.box .bd.z{visibility:hidden}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:12px;white-space:nowrap}
.tag.ok{background:#12603a;color:#7affc0}.tag.bad{background:#6a1428;color:#ff9aa6}
.tg{width:46px;height:26px;border-radius:14px;background:#3a2a6a;position:relative;flex:none;transition:.2s}
.tg:after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:#7a2dff}.tg.on:after{left:23px}
textarea,.in{width:100%;border-radius:12px;border:1px solid #8b57ff;background:#0f0634;color:#fff;padding:11px;font-size:16px}
textarea{min-height:96px;resize:vertical}
.pr{width:100%;margin-top:10px;padding:12px;border-radius:12px;font-weight:700;background:linear-gradient(135deg,#8a3dff,#4a1fb0);border:1px solid #b78bff;color:#fff}
.note{font-size:12px;color:#b9b2f5;margin:8px 0 0}
.sub{margin:14px 0 8px;font-size:13px;font-weight:700;color:#d9d4ff}
.bg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bg .sm{padding:10px 4px;text-align:center}
.bg .sm.red{border-color:#ff4d5e;background:linear-gradient(135deg,#8a1a30,#4a0f20)}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 16rem);transform:translateX(-50%) translateY(20px);opacity:0;pointer-events:none;background:#2a1a6a;border:1px solid #8b57ff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:60;transition:.25s;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;letter-spacing:.4px}
.sm.red{border-color:#ff4d5e;background:linear-gradient(135deg,#8a1a30,#4a0f20);color:#ffd5da}
.sm.on{border-color:#c9a2ff;background:linear-gradient(135deg,#8a38ff,#4a1fb0)}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<linearGradient id="gGold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff0a0"/><stop offset=".55" stop-color="#ffc233"/><stop offset="1" stop-color="#e8861a"/></linearGradient>
<linearGradient id="gPur" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#d6a8ff"/><stop offset="1" stop-color="#7a2dff"/></linearGradient>

<linearGradient id="gRed" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a7a"/><stop offset="1" stop-color="#d81f3a"/></linearGradient>
<linearGradient id="gZ" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7ae6"/><stop offset=".5" stop-color="#a45cff"/><stop offset="1" stop-color="#5a3dff"/></linearGradient>
<linearGradient id="gW" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#9a55ff" stop-opacity="0"/><stop offset=".5" stop-color="#c58bff" stop-opacity=".9"/><stop offset="1" stop-color="#7a40ff" stop-opacity=".5"/></linearGradient>

<script src="zenvyro-api.js"></script>
<script>
(() => {
  "use strict";
  /* Zenvyro Admin Panel. Demo preview: figures and users are sample data until the backend is connected.
     Optional live data: set window.ZENVYRO_ADMIN_ENDPOINT to a JSON URL with the same keys as DEMO. */
  const KEY = "zenvyro_admin_v2";
  const DEMO = { users: 48750, usersD: 12.5, premium: 12380, premD: 8.3, deposit: 245780, depD: 15.2, withdraw: 198650, wdD: 13.7,
    profit: 47130, profD: 18.9, sales: 12580, salesD: 21.4, today: 1250, todayD: 16.7, month: 12580, monthD: 22.3 };
  const PACKS = [["Free", 0, 0.001587], ["Standard", 10, 0.002222], ["Silver", 25, 0.006945], ["Gold", 50, 0.017361], ["Platinum", 100, 0.050505]];
  const ROWS = [["wd", "Withdrawal Requests", "i-cash", "p", "Withdrawal"], ["dep", "Deposit Requests", "i-dl", "g", "Deposit"], ["ex", "Exchange Requests", "i-sw", "b", "Exchange"]];
  const DUR = [["1 Day", 1], ["3 Days", 3], ["7 Days", 7], ["1 Month", 30], ["6 Months", 182], ["1 Year", 365]];
  const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
  let data = { ...DEMO }, days = 7;

  function seedUsers() {
    const pk = [0, 1, 0, 2, 0, 3, 0, 0, 4, 1, 0, 2, 0, 1], bal = [12.5, 0, 3.2, 45, 0, 120, .8, 0, 300, 9, 0, 60, 2, 15];
    return pk.map((p, i) => ({ id: "ZV-" + (20410 + i * 137), name: "zv_user_" + (20410 + i * 137), pack: PACKS[p][0], balance: bal[i], joined: Date.now() - (i + 1) * 86400000 * 4, ban: null }));
  }
  let st = { pend: { wd: 12, dep: 8, ex: 6 }, set: { maint: false, reg: true, wdraw: true }, logs: [], users: null };
  try { const s = JSON.parse(localStorage.getItem(KEY) || "null"); if (s) st = { ...st, ...s, pend: { ...st.pend, ...s.pend }, set: { ...st.set, ...s.set } }; } catch (e) {}
  if (!Array.isArray(st.users) || !st.users.length) st.users = seedUsers();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) {} };
  const log = t => { st.logs.unshift({ t, ts: Date.now() }); st.logs = st.logs.slice(0, 60); save(); };
  const fmt = { n: v => Math.round(v).toLocaleString("en-US"), m: v => "$" + Math.round(v).toLocaleString("en-US"),
    m2: v => "$" + v.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) };
  const when = ts => new Date(ts).toLocaleString("en-GB", { day: "2-digit", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit", hour12: false });
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  let tt; function toast(m) { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => t.classList.remove("on"), 2400); }

  /* ---- user control (ban / unban / send dollars) ---- */
  const user = id => st.users.find(u => u.id === id);
  const banned = u => !!(u && u.ban && u.ban.until > Date.now());
  const A = window.ZenvyroAdmin = {
    getUsers: () => st.users.map(u => ({ ...u, banned: banned(u) })),
    banUser(id, d, reason) { const u = user(id); if (!u || !(d > 0)) return false; u.ban = { until: Date.now() + d * 86400000, days: d, reason: reason || "", at: Date.now() }; log("Banned " + u.name + " for " + d + " day(s)"); save(); return true; },
    unbanUser(id) { const u = user(id); if (!u) return false; u.ban = null; log("Unbanned " + u.name); save(); return true; },
    giveDollars(id, amt) { const u = user(id); amt = Math.round(+amt * 100) / 100; if (!u || !(amt > 0) || amt > 100000) return false; u.balance = Math.round((u.balance + amt) * 100) / 100; log("Sent " + fmt.m2(amt) + " to " + u.name); save(); return true; }
  };

  /* ---- stats ---- */
  function paint(anim) {
    $$("[data-d]").forEach(e => e.textContent = "+" + Number(data[e.dataset.d]).toFixed(1) + "%");
    $$("[data-k]").forEach(e => {
      const to = Number(data[e.dataset.k]) || 0, f = fmt[e.dataset.f], t0 = performance.now();
      if (!anim) { e.textContent = f(to); return; }
      (function step(t) { const p = Math.min(1, (t - t0) / 700); e.textContent = f(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); })(t0);
    });
  }
  async function load() {
    const url = window.ZENVYRO_ADMIN_ENDPOINT;
    if (url) {
      try { const r = await fetch(url, { headers: { Accept: "application/json" }, cache: "no-store" }); if (!r.ok) throw 0; const j = await r.json();
        for (const k in DEMO) if (Number.isFinite(+j[k])) data[k] = +j[k]; } catch (e) { toast("Could not load live data"); }
    }
    paint(true);
  }

  /* ---- chart (drawn in reference pixel units) ---- */
  function series(n, kind) {
    if (n === 7) return kind ? [9500, 14400, 18100, 14800, 20400, 19900, 27700] : [4300, 8800, 10500, 9400, 15200, 14000, 20600];
    let a = [], r = kind ? 7 : 3, base = kind ? 6000 : 2500, top = kind ? 28000 : 21000;
    for (let i = 0; i < n; i++) { r = (r * 49297 + 233280) % 233280; a.push(base + (top - base) * (i / (n - 1)) * .85 + (r / 233280 - .5) * top * .2); }
    return a.map(v => Math.max(1500, Math.min(29000, v)));
  }
  function curve(p) { let d = "M" + p[0][0] + " " + p[0][1]; for (let i = 0; i < p.length - 1; i++) { const a = p[i - 1] || p[i], b = p[i], c = p[i + 1], e = p[i + 2] || c;
    d += `C${(b[0] + (c[0] - a[0]) / 6).toFixed(1)} ${(b[1] + (c[1] - a[1]) / 6).toFixed(1)} ${(c[0] - (e[0] - b[0]) / 6).toFixed(1)} ${(c[1] - (e[1] - b[1]) / 6).toFixed(1)} ${c[0]} ${c[1]}`; } return d; }
  function chart() {
    const L = 83, R = 740, T = 8, B = 163, W = R - L, H = B - T, n = days;
    const x = i => L + W * i / (n - 1), y = v => B - H * Math.min(v, 30000) / 30000;
    let g = '<rect x="' + L + '" y="' + T + '" width="' + W + '" height="' + H + '" fill="#0a0430" fill-opacity=".35"/>';
    ["30K", "20K", "10K", "0K"].forEach((l, i) => { const yy = T + H * i / 3; g += `<line x1="${L}" x2="${R}" y1="${yy}" y2="${yy}" stroke="#7a4cff" stroke-opacity=".3"/><text x="33" y="${yy + 6}">${l}</text>`; });
    const step = n > 7 ? Math.ceil(n / 7) : 1, now = new Date();
    for (let i = 0; i < n; i++) {
      g += `<line x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${B}" stroke="#7a4cff" stroke-opacity=".18"/>`;
      if ((n - 1 - i) % step === 0) { const d = new Date(now); d.setDate(now.getDate() - (n - 1 - i)); g += `<text x="${x(i)}" y="190" text-anchor="middle">${d.toLocaleDateString("en-US", { month: "short", day: "2-digit" })}</text>`; }
    }
    [[series(n, 0), "#ffc233", "gy"], [series(n, 1), "#b45cff", "gp"]].forEach(([s, c, id]) => {
      const p = s.map((v, i) => [+x(i).toFixed(1), +y(v).toFixed(1)]), d = curve(p);
      g += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".6"/><stop offset="1" stop-color="${c}" stop-opacity=".06"/></linearGradient></defs>`;
      g += `<path d="${d}L${R} ${B}L${L} ${B}Z" fill="url(#${id})"/><path d="${d}" fill="none" stroke="${c}" stroke-width="4.5" stroke-linecap="round" style="filter:drop-shadow(0 0 5px ${c})"/>`;
      if (n <= 14) p.forEach(q => g += `<circle cx="${q[0]}" cy="${q[1]}" r="7" fill="${c}" stroke="#fff" stroke-opacity=".9" stroke-width="2.200"/>`);
    });
    $("#chart").innerHTML = g;
  }

  /* ---- pending requests ---- */
  function renderReq() {
    $("#rq").innerHTML = ROWS.map(r => `<div class="rq"><div class="bx ${r[3]}"><svg viewBox="0 0 24 24"><use href="#${r[2]}"/></svg></div><span class="n">${r[1]}</span><span class="bd ${st.pend[r[0]] ? "" : "z"}">${st.pend[r[0]]}</span><button class="sm" data-view="${r[0]}">View</button><button class="sm ap" data-appr="${r[0]}" ${st.pend[r[0]] ? "" : "disabled"}>Approve</button></div>`).join("");
  }
  function approve(t) {
    if (!st.pend[t]) return toast("No pending requests");
    st.pend[t]--; const r = ROWS.find(x => x[0] === t); log(r[4] + " request approved"); save(); renderReq(); toast(r[4] + " request approved");
  }
  function reqItems(t) {
    const n = Math.min(st.pend[t], 12), r = ROWS.find(x => x[0] === t), seed = { wd: 37, dep: 53, ex: 71 }[t];
    return Array.from({ length: n }, (_, i) => { const id = "ZV-" + (10000 + (seed * (i + 3) * 97) % 89999), amt = 10 + (seed * (i + 5)) % 190;
      return `<div class="li"><div>${id}<small>${r[4]} · $${amt}.00</small></div><button class="sm ap" data-appr2="${t}">Approve</button></div>`; }).join("") || '<div class="li">No pending requests</div>';
  }

  /* ---- sheets ---- */
  const tg = (k, label, sub) => `<div class="li"><div>${label}<small>${sub}</small></div><button class="tg ${st.set[k] ? "on" : ""}" data-tg="${k}" aria-label="${label}"></button></div>`;
  const userRows = q => { q = (q || "").trim().toLowerCase();
    const l = st.users.filter(u => !q || u.name.toLowerCase().includes(q) || u.id.toLowerCase().includes(q));
    return l.map(u => `<div class="li u" data-user="${u.id}"><div>${u.name}<small>${u.id} · ${u.pack} Pack · ${fmt.m2(u.balance)}</small></div><span class="tag ${banned(u) ? "bad" : "ok"}">${banned(u) ? "Banned" : "Active"}</span></div>`).join("") || '<div class="li">No users found</div>'; };
  function userPage(id) {
    const u = user(id), b = banned(u);
    return [u.name, `<div class="li"><div>${u.id}<small>${u.pack} Pack · Joined ${when(u.joined).slice(0, 11)}</small></div><span class="tag ${b ? "bad" : "ok"}">${b ? "Banned" : "Active"}</span></div>
<div class="li"><div>Wallet Balance<small>Demo balance</small></div><b>${fmt.m2(u.balance)}</b></div>` +
      (b ? `<div class="li"><div>Banned until<small>${when(u.ban.until)}</small></div><button class="sm ap" data-unban="${u.id}">Unban</button></div>` : "") +
      `<p class="sub">${b ? "Change ban to" : "Ban this user for"}</p><div class="bg">${DUR.map(d => `<button class="sm red" data-ban="${u.id}" data-days="${d[1]}" data-lb="${d[0]}">${d[0]}</button>`).join("")}</div>
<p class="sub">Send dollars to wallet</p><input class="in" id="usd" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Amount in USD"><button class="pr" data-give="${u.id}">Send to Wallet</button>
<button class="pr" style="background:#2a1a6a" data-go="usr">Back to Users</button><p class="note">Saved on this device only for now. It reaches real users once the backend is connected.</p>`];
  }
  /* ---- Manage Membership: vouchers, crypto payments, failed attempts ---- */
  const AP = () => window.ZenvyroAPI;
  let memTab = "vouch", vFilter = "all", lastGen = null, vPackSel = "Standard", vQtySel = 10;
  const REASON = { not_found: "Code not found", already_used: "Code already used", wrong_pack: "Code is for another pack", disabled: "Disabled code", txid_reused: "TXID already used" };
  const copy = t => { if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => toast("Copied")).catch(() => toast("Copy failed")); else toast("Copy not supported"); };
  const memTabs = c => `<div class="bg" style="grid-template-columns:repeat(4,1fr);margin-bottom:12px">${[["packs", "Packs"], ["vouch", "Vouchers"], ["pay", "Crypto" + (c.pending ? " (" + c.pending + ")" : "")], ["att", "Attempts"]].map(t => `<button class="sm ${memTab === t[0] ? "on" : ""}" data-mt="${t[0]}">${t[1]}</button>`).join("")}</div>`;
  const vRow = x => `<div class="li"><div><span class="mono">${esc(x.code)}</span><small>${esc(x.pack)} ${x.trx} TRX · ${x.status}${x.usedBy ? " · by " + esc(x.usedBy) + " · " + when(x.usedAt) : " · created " + when(x.createdAt)}</small></div>${x.status === "unused" ? `<button class="sm red" data-vdis="${x.id}">Disable</button>` : `<span class="tag ${x.status === "used" ? "ok" : "bad"}">${x.status}</span>`}</div>`;
  const pRow = p => `<div class="li" style="align-items:flex-start"><div style="min-width:0"><b>${esc(p.pack)} Pack · ${p.trx} TRX</b><small>${esc(p.user)} · ${esc((AP().ASSETS.find(a => a.id === p.asset) || {}).asset || p.asset)} · ${when(p.createdAt)}</small><small class="mono" style="word-break:break-all;color:#d9d4ff">${esc(p.txid)}</small><button class="sm" style="margin-top:6px;padding:4px 10px" data-copytext="${esc(p.txid)}">Copy TXID</button></div><div style="display:grid;gap:6px;justify-items:end"><span class="tag ${p.status === "approved" ? "ok" : p.status === "rejected" ? "bad" : ""}" ${p.status === "pending" ? 'style="background:#5a4a1a;color:#e5c16c"' : ""}>${p.status}</span>${p.status === "pending" ? `<button class="sm ap" data-pok="${p.id}">Approve</button><button class="sm red" data-pno="${p.id}">Reject</button>` : ""}</div></div>`;
  async function openMem() {
    const c = await AP().adminCounts(); let h = memTabs(c);
    if (memTab === "packs") h += PACKS.map(p => `<div class="li"><div>${p[0]} Pack<small>${p[2].toFixed(6)} ZENY / hour</small></div><b>$${p[1]}</b></div>`).join("") + '<p class="note">Pack prices and rates are read-only here.</p>';
    else if (memTab === "vouch") {
      const v = await AP().adminVouchers(), cnt = k => v.filter(x => k === "all" || x.status === k).length, list = v.filter(x => vFilter === "all" || x.status === vFilter).slice(0, 100);
      h += `<p class="sub" style="margin-top:2px">Generate vouchers</p><select class="in" id="vPack">${Object.entries(AP().PACKS).map(([n, u]) => `<option value="${n}"${n === vPackSel ? " selected" : ""}>${n} Pack ($${u})</option>`).join("")}</select>
<input class="in" id="vQty" type="number" inputmode="numeric" min="1" max="200" value="${vQtySel}" style="margin-top:8px" placeholder="How many codes (1 to 200)"><button class="pr" data-gen>Generate Codes</button>`;
      if (lastGen) h += `<p class="sub">New codes (${lastGen.length}). Copy them now.</p><textarea class="in" id="vOut" readonly rows="6" style="font-family:ui-monospace,Menlo,monospace;font-size:13px">${lastGen.join("\n")}</textarea><button class="pr" data-copy="vOut" style="background:#2a1a6a">Copy All Codes</button>`;
      h += `<p class="sub">All vouchers</p><div class="bg" style="grid-template-columns:repeat(4,1fr);margin-bottom:6px">${["all", "unused", "used", "disabled"].map(k => `<button class="sm ${vFilter === k ? "on" : ""}" data-vf="${k}">${k[0].toUpperCase() + k.slice(1)} ${cnt(k)}</button>`).join("")}</div>${list.map(vRow).join("") || '<div class="li">No vouchers yet</div>'}<p class="note">Each code works only for its own pack. Treat codes like cash and share them only with the buyer.</p>`;
    } else if (memTab === "pay") {
      const p = await AP().adminPayments(), info = await AP().payInfo();
      h += `<p class="sub" style="margin-top:2px">Payment requests</p>${p.map(pRow).join("") || '<div class="li">No payment requests yet</div>'}<p class="note">Approve only after you see the funds in your own wallet. A used TXID can never be submitted again.</p>
<p class="sub">Receiving addresses</p>${info.map(a => `<label class="note" style="display:block;margin:10px 0 4px">${a.asset} (${a.network})</label><input class="in" data-addr="${a.id}" value="${esc(a.address)}" placeholder="Wallet address" autocomplete="off" spellcheck="false">`).join("")}<button class="pr" data-saveaddr>Save Addresses</button><p class="note">Double-check every address. Members will send real money to these addresses.</p>`;
    } else {
      const at = await AP().adminAttempts(), rs = await AP().adminRestricted();
      if (AP().mode === "demo") h += '<div class="note" style="margin:0 0 8px;padding:10px 12px;border:1px solid #70552b;border-radius:12px;color:#e7d9b7">Demo mode: this list shows only accounts used in THIS browser. Real, all-device control comes with the backend.</div>';
      h += `<p class="sub" style="margin-top:2px">Restricted accounts</p>${rs.map(r => `<div class="li"><div>${esc(r.userId)}<small>${r.banned ? "Restricted until " + when(r.bannedUntil) : "Warning on record, not restricted"} · restrictions: ${r.banCount}</small></div><div style="display:grid;gap:6px;justify-items:end">${r.banned ? `<button class="sm ap" data-unb="${esc(r.userId)}">Unban</button>` : '<span class="tag bad">Warning</span>'}<button class="sm" data-clr="${esc(r.userId)}">Clear record</button></div></div>`).join("") || '<div class="li">No restricted accounts</div>'}
<p class="sub">Failed attempts (latest 100)</p>${at.map(a => `<div class="li"><div>${esc(a.user)}<small>${REASON[a.reason] || a.reason} · tried ${esc(a.pack)} Pack · code ${esc(a.code)}</small></div><small>${when(a.ts)}</small></div>`).join("") || '<div class="li">No failed attempts</div>'}`;
    }
    show("Manage Membership", h, "mem");
  }
  async function gen() {
    const n = +$("#vQty").value, pk = $("#vPack").value; vPackSel = pk; vQtySel = n;
    if (!(n >= 1 && n <= 200)) return toast("Enter a number from 1 to 200");
    if (!confirm("Generate " + n + " voucher code(s) for the " + pk + " Pack?")) return;
    const r = await AP().adminGenerate(pk, n, ""); if (!r.ok) return toast("Could not generate codes");
    lastGen = r.codes; log("Generated " + n + " x " + pk + " vouchers"); toast(n + " code(s) generated"); openMem();
  }
  async function decide(id, ok) {
    let note = "";
    if (ok) { if (!confirm("Approve this payment? Do this only after the funds are visible in your wallet.")) return; }
    else { note = prompt("Reason for rejecting (optional)"); if (note === null) return; }
    if (await AP().adminDecide(id, ok, note)) { log("Crypto payment " + (ok ? "approved" : "rejected")); toast(ok ? "Payment approved, pack activated" : "Payment rejected"); openMem(); }
  }
  async function saveAddr() {
    for (const i of $$("[data-addr]")) await AP().adminSetAddress(i.dataset.addr, i.value);
    log("Receiving addresses updated"); toast("Addresses saved");
  }
  function adminClick(e) {
    const q = a => e.target.closest(a); let b;
    if ((b = q("[data-mt]"))) { memTab = b.dataset.mt; openMem(); return true; }
    if ((b = q("[data-vf]"))) { vFilter = b.dataset.vf; openMem(); return true; }
    if (q("[data-gen]")) { gen(); return true; }
    if ((b = q("[data-copy]"))) { const t = document.getElementById(b.dataset.copy); if (t) copy(t.value); return true; }
    if ((b = q("[data-copytext]"))) { copy(b.dataset.copytext); return true; }
    if ((b = q("[data-vdis]"))) { if (confirm("Disable this voucher? It can no longer be redeemed.")) AP().adminDisable(b.dataset.vdis).then(() => { log("Voucher disabled"); openMem(); }); return true; }
    if ((b = q("[data-pok]"))) { decide(b.dataset.pok, true); return true; }
    if ((b = q("[data-pno]"))) { decide(b.dataset.pno, false); return true; }
    if ((b = q("[data-unb]"))) { if (confirm("Remove the restriction from " + b.dataset.unb + "?")) AP().adminUnban(b.dataset.unb).then(() => { log("Unbanned " + b.dataset.unb); openMem(); }); return true; }
    if ((b = q("[data-clr]"))) { if (confirm("Unban " + b.dataset.clr + " and clear all strikes and warnings?")) AP().adminUnban(b.dataset.clr, true).then(() => { log("Cleared record of " + b.dataset.clr); openMem(); }); return true; }
    if (q("[data-saveaddr]")) { saveAddr(); return true; }
    return false;
  }

  const PAGES = {
    req: () => ["Pending Requests", ROWS.map(r => `<div class="li" style="font-weight:700">${r[1]}<span class="bd ${st.pend[r[0]] ? "" : "z"}">${st.pend[r[0]]}</span></div>` + reqItems(r[0])).join("")],
    rep: () => ["Membership Report", `<div class="li"><div>Today's Sales<small>Demo figure</small></div><b>${fmt.m2(data.today)}</b></div><div class="li"><div>This Month<small>Demo figure</small></div><b>${fmt.m2(data.month)}</b></div>` + PACKS.slice(1).map((p, i) => `<div class="li"><div>${p[0]} Pack<small>$${p[1]} · ${[420, 260, 140, 60][i]} active members</small></div><b>$${(p[1] * [420, 260, 140, 60][i]).toLocaleString("en-US")}</b></div>`).join("")],
    ann: () => ["Send Announcement", '<textarea id="annT" maxlength="300" placeholder="Write your announcement"></textarea><button class="pr" id="annS">Send Announcement</button><p class="note">Saved on this device only. Connect the backend to deliver it to users.</p>'],
    mem: () => ["Manage Membership", ""],
    set: () => ["System Settings", tg("maint", "Maintenance Mode", "Pause the app for all users") + tg("reg", "New Registrations", "Allow new accounts") + tg("wdraw", "Withdrawals", "Allow withdrawal requests") + '<p class="note">Settings are stored on this device until the backend is connected.</p>'],
    log: () => ["Activity Logs", st.logs.length ? st.logs.map(l => `<div class="li"><div>${esc(l.t)}<small>${when(l.ts)}</small></div></div>`).join("") : '<div class="li">No activity yet</div>'],
    usr: () => ["Users", '<input class="in" id="uq" type="search" placeholder="Search by name or ID" autocomplete="off"><div id="ul" style="margin-top:6px">' + userRows("") + '</div><p class="note">Tap a user to ban, unban or send dollars. Sample users until the backend is connected.</p>'],
    txn: () => ["Transactions", [["Deposit", 100], ["Withdraw", 45], ["Exchange", 20], ["Deposit", 50], ["Withdraw", 15], ["Exchange", 8]].map((t, i) => `<div class="li"><div>${t[0]}<small>${when(Date.now() - i * 5400000)}</small></div><b>$${t[1]}.00</b></div>`).join("") + '<p class="note">Sample list. Real transactions appear after the backend is connected.</p>'],
    menu: () => ["Menu", [["dash", "Dashboard"], ["usr", "Users"], ["txn", "Transactions"], ["set", "Settings"], ["rep", "Reports"]].map(a => `<div class="li"><a href="#" data-go="${a[0]}">${a[1]}</a></div>`).join("") + '<div class="li"><a href="index.html">Back to Zenvyro app</a></div>'],
    me: () => ["Admin Account", '<div class="li"><div>Administrator<small>Full access (demo)</small></div></div><div class="li"><a href="index.html">Back to Zenvyro app</a></div>']
  };
  function show(t, h, k) { $("#shT").textContent = t; $("#shB").innerHTML = h; $("#sheet").classList.add("on"); $("#sheet").dataset.k = k; }
  const open = k => { if (k === "mem") return openMem(); const [t, h] = PAGES[k](); show(t, h, k); };
  const close = () => $("#sheet").classList.remove("on");
  function go(k) {
    $$("#nav button").forEach(b => b.classList.toggle("on", b.dataset.nav === k));
    if (k === "dash") { close(); window.scrollTo({ top: 0, behavior: "smooth" }); } else open(k);
  }
  const openUser = id => { const [t, h] = userPage(id); show(t, h, "u" + id); };

  document.addEventListener("click", e => {
    const q = a => e.target.closest(a);
    let b;
    if (adminClick(e)) return;
    if ((b = q("[data-appr]"))) approve(b.dataset.appr);
    else if ((b = q("[data-view]"))) { const r = ROWS.find(x => x[0] === b.dataset.view); show(r[1], reqItems(r[0]), "v" + r[0]); }
    else if ((b = q("[data-appr2]"))) { const t = b.dataset.appr2; approve(t); if ($("#sheet").dataset.k === "req") open("req"); else $("#shB").innerHTML = reqItems(t); }
    else if ((b = q("[data-user]"))) openUser(b.dataset.user);
    else if ((b = q("[data-ban]"))) { const u = user(b.dataset.ban); if (confirm("Ban " + u.name + " for " + b.dataset.lb + "?") && A.banUser(u.id, +b.dataset.days)) { toast(u.name + " banned for " + b.dataset.lb); openUser(u.id); } }
    else if ((b = q("[data-unban]"))) { if (A.unbanUser(b.dataset.unban)) { toast("User unbanned"); openUser(b.dataset.unban); } }
    else if ((b = q("[data-give]"))) { const v = $("#usd").value; if (A.giveDollars(b.dataset.give, v)) { toast(fmt.m2(Math.round(+v * 100) / 100) + " sent to wallet"); openUser(b.dataset.give); } else toast("Enter a valid amount"); }
    else if ((b = q("[data-open]"))) open(b.dataset.open);
    else if ((b = q("[data-nav]"))) go(b.dataset.nav);
    else if ((b = q("[data-go]"))) { e.preventDefault(); go(b.dataset.go); }
    else if ((b = q("[data-tg]"))) { const k = b.dataset.tg; st.set[k] = !st.set[k]; b.classList.toggle("on", st.set[k]); log("Setting changed: " + k + " " + (st.set[k] ? "on" : "off")); save(); }
    else if (q("#annS")) { const v = $("#annT").value.trim(); if (!v) return toast("Write a message first"); log("Announcement: " + v.slice(0, 60)); toast("Announcement saved"); close(); }
    else if (q("#bMenu")) open("menu");
    else if (q("#bMe")) open("me");
    else if (q("#shX") || e.target.id === "sheet") close();
    else if (q("#rngB")) $("#rng").classList.toggle("open");
    else if ((b = q(".menu2 button"))) { days = +b.dataset.n; $$(".menu2 button").forEach(x => x.classList.toggle("on", x === b)); $("#rngT").textContent = "Last " + days + " Days"; $("#rng").classList.remove("open"); chart(); }
    else if (!q("#rng")) $("#rng").classList.remove("open");
  });
  document.addEventListener("input", e => { if (e.target.id === "uq") $("#ul").innerHTML = userRows(e.target.value); });
  document.addEventListener("change", e => { if (e.target.id === "vPack") vPackSel = e.target.value; });
  document.addEventListener("input", e => { if (e.target.id === "vQty") vQtySel = e.target.value; });

  function net() { const s = $("#srv"), on = navigator.onLine !== false; s.classList.toggle("off", !on); s.querySelector("span").textContent = on ? "Server Online" : "Server Offline"; }
  window.addEventListener("online", net); window.addEventListener("offline", net);
  net(); renderReq(); chart(); load();
})();
</script>
</body>
</html>
